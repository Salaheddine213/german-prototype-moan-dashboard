name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src --max-warnings 0
      - run: npm run build  # tsc -b + vite build = the API contract check

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/backend
    # MARKET_DUCKDB_PATH is not set → duckdb_path=None → demo mode.
    # All tests run against in-memory synthetic German market data.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dashboard/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v
